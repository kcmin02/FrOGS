# AgPd, 125-site 5x5x5 fcc cell (Fig. 3a, Fig. 4a).
system: agpd_ce
lattice_shape: [5, 5, 5]
table_path: data/agpd_cluster_tables_L5.npz
cond_low: [-0.4, 200.0]       # [dmu (eV), T (K)]
cond_high: [0.4, 900.0]

prior: autoregressive
prior_net: {num_layers: 4, num_channels: 64, kernel_size: 3}
prior_lr: 1.0e-4
prior_backend: systems        # fused Triton kernels; `reference` restores the original arithmetic
sym_penalty: 0.1

transport: true
num_levels: 2
kernel_size: 3
num_channels: 16
encoder_convs: 1
decoder_convs: 1
loo_context: true
metropolis_rates: true        # Eq. (7)

free_energy_hidden: [200, 200, 200, 200]
lr: 3.0e-4
lr_gamma: 0.995
lr_step: 1000
grad_clip: 1000
max_steps: 200000

n_steps: 125
starting_k: 1
n_anneal: 60000
n_mcmc: 40
batch_size: 50
loss_batch_size: 100
buffer_size: 100
buffer_cycle: 100

wandb_project: frogs-agpd
run_tag: agpd125
seed:
